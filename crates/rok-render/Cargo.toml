[package]
name = "rok-render"
description = "atom-engine based template rendering for rok-gen, with naming filters and Rust-safe output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
atom-engine = "=5.0.2"
heck = "0.5.0"
pluralizer = "0.5.0"
serde_json = "1.0.151"
syn = { version = "2", features = ["full"] }
tera = { version = "1", default-features = false }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
