[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/ateeq1999/rok-gen"
homepage = "https://github.com/ateeq1999/rok-gen"
authors = ["ateeq1999"]

[workspace.dependencies]
rok-check = { path = "crates/rok-check", version = "0.1.0" }
rok-plan = { path = "crates/rok-plan", version = "0.1.0" }
rok-edit = { path = "crates/rok-edit", version = "0.1.0" }
rok-journal = { path = "crates/rok-journal", version = "0.1.0" }
rok-locate = { path = "crates/rok-locate", version = "0.1.0" }
rok-render = { path = "crates/rok-render", version = "0.1.0" }

# Same ruleset the reference project (actix-api-starter) enforces, so the tool
# holds itself to the bar it checks other projects against.
[workspace.lints.rust]
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
